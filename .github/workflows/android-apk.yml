name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache glslang-tools
          SDKMANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses <<< "$(printf 'y\n%.0s' {1..20})" > /dev/null
          "$SDKMANAGER" --channel=3 "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6"

      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: android-deps-v1-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'src/android/app/build.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-deps-v1-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'src/android/app/build.gradle.kts') }}-
            android-deps-v1-${{ runner.os }}-

      - uses: actions/cache/restore@v4
        id: native
        with:
          path: |
            src/android/app/.cxx
            src/android/app/build/intermediates/cxx
            externals/generated/sdl
          key: android-native-v1-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.cppm', '**/*.c', '**/*.h', '**/*.hpp', '**/*.S', '**/*.cmake', '**/CMakeLists.txt', 'cpmfile.json', '.patch/**', 'src/android/*.gradle.kts', 'src/android/gradle.properties', 'src/android/app/build.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties', '.github/workflows/android-apk.yml', '!.cache/**', '!src/android/app/.cxx/**', '!src/android/app/build/**') }}

      - name: Build one APK
        working-directory: src/android
        run: |
          args=(--build-cache --max-workers=2
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8'
            -Pkotlin.compiler.execution.strategy=in-process
            '-PYUZU_ANDROID_ARGS=-DUSE_CCACHE=ON -DENABLE_LTO=OFF -DCMAKE_JOB_POOLS=compile=2;link=1 -DCMAKE_JOB_POOL_COMPILE=compile -DCMAKE_JOB_POOL_LINK=link'
            --stacktrace)
          ./gradlew ':app:configureCMakeDebug[arm64-v8a]' "${args[@]}"
          ./gradlew :app:assembleMainlineDebug "${args[@]}"

      - uses: actions/cache/save@v4
        if: always() && steps.dependencies.outputs.cache-primary-key != ''
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - uses: actions/cache/save@v4
        if: success() && steps.native.outputs.cache-hit != 'true'
        with:
          path: |
            src/android/app/.cxx
            src/android/app/build/intermediates/cxx
            externals/generated/sdl
          key: ${{ steps.native.outputs.cache-primary-key }}

      - name: Cache statistics
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true

      - uses: actions/upload-artifact@v4
        with:
          name: eden-touch-arm64-${{ github.run_number }}
          path: src/android/app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
