name: Android Touch UI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-touch-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools
          SDKMANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses <<< "$(printf 'y\n%.0s' {1..20})" > /dev/null
          "$SDKMANAGER" --channel=3 "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.6"

      - uses: actions/cache/restore@v4
        id: cpm
        with:
          path: .cache/cpm
          key: android-touch-cpm-v1-${{ runner.os }}-${{ hashFiles('cpmfile.json', '.patch/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-touch-cpm-v1-${{ runner.os }}-${{ hashFiles('cpmfile.json', '.patch/**') }}-
            android-touch-cpm-v1-${{ runner.os }}-
            android-deps-v1-${{ runner.os }}-

      - name: Configure generated Android sources
        working-directory: src/android
        run: |
          ./gradlew ':app:configureCMakeDebug[arm64-v8a]' \
            --build-cache --max-workers=2 --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-PYUZU_ANDROID_ARGS=-DUSE_CCACHE=OFF -DENABLE_LTO=OFF'

      - name: Render actual Android touch views
        working-directory: src/android
        run: |
          ./gradlew :app:testMainlineDebugUnitTest \
            --tests '*TouchWorkspaceScreenshotTest' \
            --tests '*TouchWorkspaceInteractionTest' \
            --build-cache --max-workers=2 --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-PYUZU_ANDROID_ARGS=-DUSE_CCACHE=OFF -DENABLE_LTO=OFF'

      - uses: actions/cache/save@v4
        if: always() && steps.cpm.outputs.cache-primary-key != ''
        with:
          path: .cache/cpm
          key: ${{ steps.cpm.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eden-touch-ui-${{ github.run_number }}
          path: |
            src/android/app/build/reports/touch-ui/*.png
            src/android/app/build/reports/tests/testMainlineDebugUnitTest/
            src/android/app/build/test-results/testMainlineDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
